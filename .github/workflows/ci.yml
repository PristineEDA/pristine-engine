name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-22.04-x64
            name: Ubuntu 22.04 x64
            runs_on: ubuntu-22.04
            arch: x64
          - id: ubuntu-24.04-x64
            name: Ubuntu 24.04 x64
            runs_on: ubuntu-24.04
            arch: x64
          - id: windows-2022-x64
            name: Windows 2022 x64
            runs_on: windows-2022
            arch: x64
          - id: windows-2025-x64
            name: Windows 2025 x64
            runs_on: windows-2025
            arch: x64
          - id: macos-15-arm64
            name: macOS 15 arm64
            runs_on: macos-15
            arch: arm64
          - id: macos-15-x64
            name: macOS 15 x64
            runs_on: macos-15-intel
            arch: x64
          - id: macos-26-arm64
            name: macOS 26 arm64
            runs_on: macos-26
            arch: arm64
          - id: macos-26-x64
            name: macOS 26 x64
            runs_on: macos-26-intel
            arch: x64

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          $cmake = Get-Content -Raw 'CMakeLists.txt'
          $cmakeMatch = [regex]::Match($cmake, '(?s)project\s*\(\s*pristine-engine\b.*?\bVERSION\s+([0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?)')
          if (-not $cmakeMatch.Success) {
            throw 'Unable to find project version in CMakeLists.txt'
          }
          $version = $cmakeMatch.Groups[1].Value

          $main = Get-Content -Raw 'src/main.cpp'
          $mainMatch = [regex]::Match($main, 'kServerVersion\s*=\s*"([^"]+)"')
          if (-not $mainMatch.Success) {
            throw 'Unable to find kServerVersion in src/main.cpp'
          }
          $serverVersion = $mainMatch.Groups[1].Value
          if ($serverVersion -ne $version) {
            throw "Version mismatch: CMakeLists.txt has $version, but src/main.cpp has $serverVersion"
          }

          $tagName = "v$version"
          $isReleaseTag = '${{ github.event_name }}' -eq 'push' -and '${{ github.ref_type }}' -eq 'tag'
          if ($isReleaseTag -and '${{ github.ref_name }}' -ne $tagName) {
            throw "Tag '${{ github.ref_name }}' does not match current version tag '$tagName'"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag-name=$tagName" >> $env:GITHUB_OUTPUT
          "is-release-tag=$($isReleaseTag.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Initialize MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache dependency archives
        uses: actions/cache@v4
        with:
          path: .deps/archives
          key: deps-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('cmake/DepsLock.cmake') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ matrix.arch }}-

      - name: Bootstrap dependencies
        run: cmake -DPRISTINE_ROOT_DIR=. -P scripts/bootstrap_deps.cmake

      - name: Configure
        run: cmake --preset dev

      - name: Validate notice files
        run: cmake --build --preset dev --target pristine_validate_notice

      - name: Build
        run: cmake --build --preset dev

      - name: Run unit tests
        run: ctest --test-dir build/dev --output-on-failure

      - name: Smoke test server version
        run: |
          $binary = Join-Path $PWD 'build/dev/pristine-engine'
          if ($IsWindows) {
            $binary = "$binary.exe"
          }
          $actual = (& $binary --version).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Version command failed with exit code $LASTEXITCODE"
          }
          $expected = 'pristine-engine ${{ steps.version.outputs.version }}'
          if ($actual -ne $expected) {
            throw "Expected version output '$expected', got '$actual'"
          }

      - name: Install to staged prefix
        run: |
          Remove-Item -Recurse -Force 'build/install-smoke' -ErrorAction SilentlyContinue
          cmake --install build/dev --prefix build/install-smoke

      - name: Validate staged install tree
        run: cmake -DPRISTINE_INSTALL_PREFIX=build/install-smoke -P scripts/validate-install-tree.cmake

      - name: Upload staged install tree
        uses: actions/upload-artifact@v4
        with:
          name: pristine-install-${{ matrix.id }}
          path: build/install-smoke
          if-no-files-found: error

  release:
    name: Release
    needs: build-test
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release version
        id: release-version
        run: |
          $cmake = Get-Content -Raw 'CMakeLists.txt'
          $cmakeMatch = [regex]::Match($cmake, '(?s)project\s*\(\s*pristine-engine\b.*?\bVERSION\s+([0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?)')
          if (-not $cmakeMatch.Success) {
            throw 'Unable to find project version in CMakeLists.txt'
          }
          $version = $cmakeMatch.Groups[1].Value
          $tagName = "v$version"
          if ('${{ github.ref_name }}' -ne $tagName) {
            throw "Tag '${{ github.ref_name }}' does not match current version tag '$tagName'"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download install artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pristine-install-*
          path: release/staged

      - name: Package release artifacts
        run: |
          $packageDir = Join-Path $PWD 'release/packages'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          $artifacts = @(Get-ChildItem -Path 'release/staged' -Directory -Filter 'pristine-install-*' | Sort-Object Name)
          if ($artifacts.Count -eq 0) {
            throw 'No pristine-install-* artifacts were downloaded'
          }

          foreach ($artifact in $artifacts) {
            $platformId = $artifact.Name -replace '^pristine-install-', ''
            $archive = Join-Path $packageDir "pristine-engine-${{ github.ref_name }}-$platformId.zip"
            Compress-Archive -Path (Join-Path $artifact.FullName '*') -DestinationPath $archive -Force
          }

          Push-Location $packageDir
          Get-FileHash -Algorithm SHA256 *.zip |
            Sort-Object Path |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii 'SHA256SUMS.txt'
          Pop-Location

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tagName = '${{ github.ref_name }}'
          $version = '${{ steps.release-version.outputs.version }}'
          $assets = @(Get-ChildItem -Path 'release/packages' -File | Sort-Object Name | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) {
            throw 'No release assets were packaged'
          }

          & gh release view $tagName *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            & gh release upload $tagName $assets --clobber
          }
          else {
            & gh release create $tagName $assets --verify-tag --generate-notes --title "pristine-engine $version"
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publication failed with exit code $LASTEXITCODE"
          }
