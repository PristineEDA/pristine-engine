name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-22.04-x64
            name: Ubuntu 22.04 x64
            runs_on: ubuntu-22.04
            arch: x64
            cxx_compiler: clang++
          - id: ubuntu-24.04-x64
            name: Ubuntu 24.04 x64
            runs_on: ubuntu-24.04
            arch: x64
            cxx_compiler: clang++
          - id: windows-2022-x64
            name: Windows 2022 x64
            runs_on: windows-2022
            arch: x64
            cxx_compiler: ''
          - id: windows-2025-x64
            name: Windows 2025 x64
            runs_on: windows-2025
            arch: x64
            cxx_compiler: ''
          - id: macos-15-arm64
            name: macOS 15 arm64
            runs_on: macos-15
            arch: arm64
            cxx_compiler: ''
          - id: macos-15-x64
            name: macOS 15 x64
            runs_on: macos-15-intel
            arch: x64
            cxx_compiler: ''
          - id: macos-26-arm64
            name: macOS 26 arm64
            runs_on: macos-26
            arch: arm64
            cxx_compiler: ''
          - id: macos-26-x64
            name: macOS 26 x64
            runs_on: macos-26-intel
            arch: x64
            cxx_compiler: ''

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          $cmake = Get-Content -Raw 'CMakeLists.txt'
          $cmakeMatch = [regex]::Match($cmake, '(?s)project\s*\(\s*pristine-engine\b.*?\bVERSION\s+([0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?)')
          if (-not $cmakeMatch.Success) {
            throw 'Unable to find project version in CMakeLists.txt'
          }
          $version = $cmakeMatch.Groups[1].Value

          $tagName = "v$version"
          $isReleaseTag = '${{ github.event_name }}' -eq 'push' -and '${{ github.ref_type }}' -eq 'tag'
          if ($isReleaseTag -and '${{ github.ref_name }}' -ne $tagName) {
            throw "Tag '${{ github.ref_name }}' does not match current version tag '$tagName'"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag-name=$tagName" >> $env:GITHUB_OUTPUT
          "is-release-tag=$($isReleaseTag.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Initialize MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache dependency archives
        uses: actions/cache@v4
        with:
          path: .deps/archives
          key: deps-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('cmake/DepsLock.cmake') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ matrix.arch }}-

      - name: Bootstrap dependencies
        run: cmake -DPRISTINE_ROOT_DIR=. -DPRISTINE_COMPONENTS="slang;fmt;zlib;lz4;fastlz;wellen;boost;lefdef;ihp_open_pdk;nlohmann_json;catch2;lsp_framework" -P scripts/bootstrap_deps.cmake

      - name: Cache RTL E2E corpus
        uses: actions/cache@v4
        with:
          path: .cache/rtl-e2e
          key: rtl-e2e-${{ runner.os }}-${{ matrix.arch }}-retrosoc-76651fd
          restore-keys: |
            rtl-e2e-${{ runner.os }}-${{ matrix.arch }}-retrosoc-

      - name: Install clang on Ubuntu 22.04
        if: runner.os == 'Linux' && matrix.runs_on == 'ubuntu-22.04'
        shell: bash
        run: |
          existing_clang="$(
            compgen -c clang++- |
              sed -n 's/^clang++-\([0-9][0-9]*\)$/\1/p' |
              sort -nr |
              awk '$1 >= 16 { print "clang++-" $1; exit }'
          )"
          if [ -n "$existing_clang" ]; then
            "$existing_clang" --version
            exit 0
          fi

          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          clang++-21 --version

      - name: Resolve C++ compiler
        id: compiler
        run: |
          $compiler = '${{ matrix.cxx_compiler }}'
          if ($IsLinux -and $compiler -eq 'clang++') {
            $defaultVersionLine = $null
            $defaultMajor = $null
            if (Get-Command 'clang++' -ErrorAction SilentlyContinue) {
              $defaultVersionLine = (& clang++ --version | Select-Object -First 1)
              if ($defaultVersionLine -match 'clang version (\d+)') {
                $defaultMajor = [int]$Matches[1]
              }
            }

            if ($null -eq $defaultMajor -or $defaultMajor -lt 16) {
              $candidates = @()
              foreach ($command in (Get-Command 'clang++-*' -ErrorAction SilentlyContinue)) {
                if ($command.Name -match '^clang\+\+-(\d+)$') {
                  $candidates += [pscustomobject]@{
                    Name = $command.Name
                    Major = [int]$Matches[1]
                  }
                }
              }

              $selected = $candidates |
                Where-Object { $_.Major -ge 16 } |
                Sort-Object Major -Descending |
                Select-Object -First 1

              if ($selected) {
                $compiler = $selected.Name
                Write-Host "Default clang++ is too old for slang C++20 ranges support: $defaultVersionLine"
              }
              elseif ($defaultVersionLine) {
                throw "Ubuntu clang++ must be version 16 or newer for slang C++20 ranges support; found: $defaultVersionLine"
              }
              else {
                throw 'matrix.cxx_compiler requested clang++, but clang++ was not found'
              }
            }
          }

          if ($compiler) {
            Write-Host "Using C++ compiler: $compiler"
          }
          "cxx=$compiler" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: |
          $args = @('--preset', 'dev')
          if ('${{ steps.compiler.outputs.cxx }}') {
            $args += "-DCMAKE_CXX_COMPILER=${{ steps.compiler.outputs.cxx }}"
          }
          $args += '-DPRISTINE_BUILD_PERF_TESTS=ON'
          cmake @args

      - name: Validate notice files
        run: cmake --build --preset dev --target pristine_validate_notice

      - name: Build
        run: cmake --build --preset dev

      - name: Build pinned slang-server for shared LSP differential
        if: matrix.id == 'ubuntu-24.04-x64'
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/hudson-trading/slang-server .cache/slang-server
          git -C .cache/slang-server checkout 0ec16ae
          git -C .cache/slang-server submodule update --init --recursive
          cmake -S .cache/slang-server -B .cache/slang-server/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="${{ steps.compiler.outputs.cxx }}" \
            -DSLANG_SERVER_INCLUDE_TESTS=OFF \
            -DSLANG_SERVER_INCLUDE_INSTALL=OFF
          cmake --build .cache/slang-server/build --target slang_server

      - name: Require shared LSP differential
        if: matrix.id == 'ubuntu-24.04-x64'
        shell: bash
        run: |
          echo "SLANG_SERVER_ROOT=${GITHUB_WORKSPACE}/.cache/slang-server" >> "$GITHUB_ENV"
          echo "PRISTINE_REQUIRE_SLANG_DIFFERENTIAL=1" >> "$GITHUB_ENV"

      - name: Create gate run context
        run: python scripts/create_gate_run_context.py --output build/gate-artifacts/run-context.json

      - name: Check full gate manifest
        env:
          PRISTINE_REQUIRE_IHP_OPEN_PDK: '1'
          PRISTINE_REQUIRE_TT_TINYQV_GDS: '1'
        run: python scripts/run_full_tests_with_status.py --build-dir build/dev --check-manifest-only --run-context build/gate-artifacts/run-context.json

      - name: Run full tests with status
        env:
          PRISTINE_REQUIRE_IHP_OPEN_PDK: '1'
          PRISTINE_REQUIRE_TT_TINYQV_GDS: '1'
        run: python scripts/run_full_tests_with_status.py --build-dir build/dev --include-perf --run-context build/gate-artifacts/run-context.json

      - name: Run clean Release gate
        run: |
          $args = @(
            'scripts/run_clean_release_gate.py',
            '--build-dir', 'build/release',
            '--run-context', 'build/gate-artifacts/run-context.json'
          )
          if ('${{ steps.compiler.outputs.cxx }}') {
            $args += @('--cxx-compiler', '${{ steps.compiler.outputs.cxx }}')
          }
          python @args

      - name: Write gate artifact index
        run: |
          python scripts/write_gate_artifact_index.py `
            --profile ci-matrix `
            --run-context build/gate-artifacts/run-context.json `
            --full-summary build/dev/test-status-logs/summary.json `
            --release-summary build/clean-release-gate-logs/summary.json `
            --output build/gate-artifacts/index.json

      - name: Upload test status logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pristine-test-status-${{ matrix.id }}
          path: |
            build/gate-artifacts
            build/dev/test-status-logs
            build/clean-release-gate-logs
          if-no-files-found: ignore

      - name: Smoke test server version
        run: |
          $binary = Join-Path $PWD 'build/dev/pristine-engine'
          if ($IsWindows) {
            $binary = "$binary.exe"
          }
          $actual = (& $binary --version).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Version command failed with exit code $LASTEXITCODE"
          }
          $expected = 'pristine-engine ${{ steps.version.outputs.version }}'
          if (-not $actual.StartsWith("$expected ")) {
            throw "Expected version output to start with '$expected ', got '$actual'"
          }

          $fields = @{}
          foreach ($token in ($actual -split '\s+' | Select-Object -Skip 2)) {
            $parts = $token -split '=', 2
            if ($parts.Count -eq 2) {
              $fields[$parts[0]] = $parts[1]
            }
          }

          foreach ($field in @('branch', 'commit', 'tag', 'os', 'arch', 'build')) {
            if (-not $fields.ContainsKey($field) -or [string]::IsNullOrWhiteSpace($fields[$field])) {
              throw "Version output is missing '$field': $actual"
            }
          }

          $expectedBranch = '${{ github.head_ref }}'
          if (-not $expectedBranch) {
            $expectedBranch = '${{ github.ref_name }}'
          }
          if ($fields['branch'] -ne $expectedBranch) {
            throw "Expected branch '$expectedBranch', got '$($fields['branch'])'"
          }

          $expectedCommit = '${{ github.sha }}'.Substring(0, 12)
          if ($fields['commit'] -ne $expectedCommit) {
            throw "Expected commit '$expectedCommit', got '$($fields['commit'])'"
          }

          $expectedTag = 'none'
          if ('${{ github.ref_type }}' -eq 'tag') {
            $expectedTag = '${{ github.ref_name }}'
          }
          if ($fields['tag'] -ne $expectedTag) {
            throw "Expected tag '$expectedTag', got '$($fields['tag'])'"
          }

          $expectedOs = switch ('${{ runner.os }}') {
            'Windows' { 'windows' }
            'Linux' { 'linux' }
            'macOS' { 'macos' }
            default { '${{ runner.os }}'.ToLowerInvariant() }
          }
          if ($fields['os'] -ne $expectedOs) {
            throw "Expected os '$expectedOs', got '$($fields['os'])'"
          }
          if ($fields['arch'] -ne '${{ matrix.arch }}') {
            throw "Expected arch '${{ matrix.arch }}', got '$($fields['arch'])'"
          }
          if ($fields['build'] -ne 'debug') {
            throw "Expected build 'debug', got '$($fields['build'])'"
          }

      - name: Install to staged prefix
        run: |
          Remove-Item -Recurse -Force 'build/install-smoke' -ErrorAction SilentlyContinue
          cmake --install build/dev --prefix build/install-smoke

      - name: Validate staged install tree
        run: cmake -DPRISTINE_INSTALL_PREFIX=build/install-smoke -P scripts/validate-install-tree.cmake

      - name: Upload staged install tree
        uses: actions/upload-artifact@v4
        with:
          name: pristine-engine-${{ matrix.id }}
          path: build/install-smoke
          if-no-files-found: error

  release:
    name: Release
    needs: build-test
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release version
        id: release-version
        run: |
          $cmake = Get-Content -Raw 'CMakeLists.txt'
          $cmakeMatch = [regex]::Match($cmake, '(?s)project\s*\(\s*pristine-engine\b.*?\bVERSION\s+([0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?)')
          if (-not $cmakeMatch.Success) {
            throw 'Unable to find project version in CMakeLists.txt'
          }
          $version = $cmakeMatch.Groups[1].Value
          $tagName = "v$version"
          if ('${{ github.ref_name }}' -ne $tagName) {
            throw "Tag '${{ github.ref_name }}' does not match current version tag '$tagName'"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download install artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pristine-engine-*
          path: release/staged

      - name: Package release artifacts
        run: |
          $packageDir = Join-Path $PWD 'release/packages'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          $artifacts = @(Get-ChildItem -Path 'release/staged' -Directory -Filter 'pristine-engine-*' | Sort-Object Name)
          if ($artifacts.Count -eq 0) {
            throw 'No pristine-engine-* artifacts were downloaded'
          }

          foreach ($artifact in $artifacts) {
            $platformId = $artifact.Name -replace '^pristine-engine-', ''
            $archive = Join-Path $packageDir "pristine-engine-${{ github.ref_name }}-$platformId.zip"
            Compress-Archive -Path (Join-Path $artifact.FullName '*') -DestinationPath $archive -Force
          }

          Push-Location $packageDir
          Get-FileHash -Algorithm SHA256 *.zip |
            Sort-Object Path |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii 'SHA256SUMS.txt'
          Pop-Location

      - name: Write release notes
        run: |
          $notesDir = Join-Path $PWD 'release'
          New-Item -ItemType Directory -Force -Path $notesDir | Out-Null
          $notes = @(
            '## Highlights'
            ''
            '- Added AST-indexed callable and macro invocation facts for deterministic signature help, inlay hints, hover, definition, and macro-expansion quick fixes.'
            '- Improved macro visibility across definitions, redefinitions, undef lifetimes, nested expansion, and include closures.'
            '- Expanded affected rebuild and query-cache invalidation for callable, macro, package, document, watched-file, and configuration changes.'
            '- Updated shared slang-server differential coverage to negotiate initialize-advertised capabilities and use the runtime server environment.'
            '- Fixed Ubuntu shared differential CI by recursively initializing pinned slang-server submodules before CMake configuration.'
            '- Expanded semantic golden, focused unit, RTL E2E, and 100/1000/5000-file performance coverage for macro and callable behavior.'
            ''
            '## Artifacts'
            ''
            'Release packages are provided per platform with SHA256 checksums in `SHA256SUMS.txt`.'
          )
          ($notes -join "`n") + "`n" | Set-Content -Encoding utf8 (Join-Path $notesDir 'release-notes.md')

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tagName = '${{ github.ref_name }}'
          $version = '${{ steps.release-version.outputs.version }}'
          $assets = @(Get-ChildItem -Path 'release/packages' -File | Sort-Object Name | ForEach-Object { $_.FullName })
          $notesFile = Join-Path $PWD 'release/release-notes.md'
          if ($assets.Count -eq 0) {
            throw 'No release assets were packaged'
          }
          if (-not (Test-Path -LiteralPath $notesFile)) {
            throw "Release notes file was not generated: $notesFile"
          }

          & gh release view $tagName *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            & gh release upload $tagName $assets --clobber
            if ($LASTEXITCODE -eq 0) {
              & gh release edit $tagName --notes-file $notesFile --title "pristine-engine $version"
            }
          }
          else {
            & gh release create $tagName $assets --verify-tag --notes-file $notesFile --title "pristine-engine $version"
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publication failed with exit code $LASTEXITCODE"
          }
